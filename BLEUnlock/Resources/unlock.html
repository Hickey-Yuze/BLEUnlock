<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Unlock Transition</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    background:
      radial-gradient(1100px 700px at 15% -10%, rgba(79, 140, 255, 0.28), transparent 60%),
      radial-gradient(900px 640px at 110% 115%, rgba(122, 92, 255, 0.24), transparent 60%),
      radial-gradient(600px 400px at 80% -20%, rgba(90, 220, 180, 0.12), transparent 55%),
      linear-gradient(160deg, #0d1017 0%, #131726 55%, #10131c 100%);
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
  }

  /* 中央圆形头像 */
  .avatar-wrap {
    position: relative;
    width: 180px; height: 180px;
    border-radius: 50%;
    opacity: 0;
    transform: scale(0.6);
    animation: avatarIn 0.5s cubic-bezier(.2,.9,.25,1.2) 1.0s forwards;
    z-index: 5;
  }
  @keyframes avatarIn {
    to { opacity: 1; transform: scale(1); }
  }
  .avatar-wrap .ring {
    position: absolute; inset: -10px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #4f8cff, #7a5cff, #5adcb4, #4f8cff);
    animation: spin 3.6s linear infinite;
    filter: blur(0.5px);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .avatar-wrap .ring::after {
    content: "";
    position: absolute; inset: 3px;
    border-radius: 50%;
    background: #0b0e16;
  }
  .avatar-wrap .avatar {
    position: absolute; inset: 6px;
    border-radius: 50%;
    overflow: hidden;
    background: linear-gradient(135deg, #1a2238, #2a1f4a);
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
  }
  .avatar-wrap .avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
  }
  /* 兜底首字 */
  .avatar-wrap .avatar .fallback {
    font-size: 56px;
    font-weight: 700;
    background: linear-gradient(120deg, #fff, #b8c6ff);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* 整体最后淡出（给系统接管的时机） */
  .fadeout {
    animation: fadeout 0.6s ease 3.4s forwards;
  }
  @keyframes fadeout {
    to { opacity: 0; visibility: hidden; }
  }

  /* 头像下方欢迎文字 */
  .greeting {
    position: absolute;
    left: 50%; top: calc(50% + 130px);
    transform: translateX(-50%);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(100deg, #5adcb4 0%, #6aa8ff 50%, #b09aff 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    opacity: 0;
    animation: greetingIn 0.8s ease 2.0s forwards;
    z-index: 5;
    white-space: nowrap;
    filter: drop-shadow(0 0 14px rgba(106, 168, 255, 0.55));
  }
  @keyframes greetingIn {
    from { opacity: 0; transform: translateX(-50%) translateY(10px); filter: blur(6px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0);    filter: blur(0); }
  }
</style>
</head>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;
function resize() {
  W = canvas.width = window.innerWidth * devicePixelRatio;
  H = canvas.height = window.innerHeight * devicePixelRatio;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  cx = W / 2; cy = H / 2;
}
resize();
window.addEventListener('resize', resize);

const COLORS = ['#4f8cff', '#7a5cff', '#5adcb4', '#8fb4ff', '#b09aff'];
const N = 280;
const particles = [];
function spawn() {
  const angle = Math.random()*Math.PI*2;
  const baseR = Math.hypot(W,H)/2*(0.55+Math.random()*0.45);
  return {
    x: cx+Math.cos(angle)*baseR,
    y: cy+Math.sin(angle)*baseR,
    vx:0, vy:0,
    r: (Math.random()*2.8+1.6)*devicePixelRatio,
    color: COLORS[Math.floor(Math.random()*COLORS.length)],
    delay: Math.random()*0.4,
    tx: cx, ty: cy,
  };
}
for (let i=0;i<N;i++) particles.push(spawn());

// 粒子扩散波：每圈由一组沿圆周分布的粒子组成
const ripples = [];
function spawnRipple(startTime) {
  const count = 260;
  const ring = [];
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.08;
    ring.push({
      angle,
      radiusJitter: (Math.random() - 0.5) * 30,
      size: (Math.random() * 3.2 + 0.8) * devicePixelRatio,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
    });
  }
  ripples.push({ startTime, ring });
}

let START = 0;
const DURATION = 3400;

// 播放解锁音效
const sfx = document.getElementById('sfx');
sfx.volume = 1.0;

function start() {
  START = performance.now();
  sfx.currentTime = 0;
  // 音效由原生层 (AVAudioPlayer) 播放，避免双重声音
  requestAnimationFrame(tick);
}

function tick(now) {
  const t = (now - START) / 1000;   // 秒
  ctx.clearRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';

  // 触发两圈粒子波
  if (t >= 1.7 && !ripples.find(r => r.startTime === 1.7)) spawnRipple(1.7);
  if (t >= 1.95 && !ripples.find(r => r.startTime === 1.95)) spawnRipple(1.95);

  // 中心引力在 0.4s 后启动，1.4s 时拉力最强
  const pull = Math.max(0, Math.min(1, (t - 0.4) / 1.0));

  for (const p of particles) {
    if (t < p.delay) continue;

    const dx = p.tx - p.x;
    const dy = p.ty - p.y;
    const dist = Math.hypot(dx, dy);

    if (dist > 40 * devicePixelRatio) {
      // 向中心加速
      const ax = (dx / dist) * pull * 2.2 * devicePixelRatio;
      const ay = (dy / dist) * pull * 2.2 * devicePixelRatio;
      p.vx += ax;
      p.vy += ay;
      // 轻微阻尼
      p.vx *= 0.96;
      p.vy *= 0.96;
    } else {
      p.vx *= 0.8; p.vy *= 0.8;
    }

    p.x += p.vx;
    p.y += p.vy;

    // 1.2s 后粒子快速淡出，不要停在中心形成空环
    const fadeOut = Math.max(0, Math.min(1, 1 - (t - 1.2) / 0.3));
    ctx.globalAlpha = fadeOut;

    // 拖尾光束
    const speed = Math.hypot(p.vx, p.vy);
    const trail = Math.min(speed * 2.2, 40 * devicePixelRatio);
    const grad = ctx.createLinearGradient(
      p.x, p.y,
      p.x - (p.vx / (speed || 1)) * trail,
      p.y - (p.vy / (speed || 1)) * trail
    );
    grad.addColorStop(0, p.color);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = p.r;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - (p.vx / (speed || 1)) * trail,
               p.y - (p.vy / (speed || 1)) * trail);
    ctx.stroke();

    // 光点
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.globalCompositeOperation = 'lighter';
  for (const r of ripples) {
    const age = t - r.startTime;
    if (age < 0 || age > 1.6) continue;
    const progress = age / 1.6;
    // 半径从 90px 扩到屏幕较短边的一半左右
    const maxR = Math.min(W, H) * 0.45;
    const radius = (90 + (maxR - 90) * progress) * devicePixelRatio;
    // 透明度随扩散衰减
    const alpha = 1 - progress;
    for (const seg of r.ring) {
      const x = cx + Math.cos(seg.angle) * (radius + seg.radiusJitter * devicePixelRatio);
      const y = cy + Math.sin(seg.angle) * (radius + seg.radiusJitter * devicePixelRatio);
      ctx.globalAlpha = alpha * 0.9;
      ctx.fillStyle = seg.color;
      ctx.beginPath();
      ctx.arc(x, y, seg.size * (1 - progress * 0.5), 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  if (t < DURATION / 1000) requestAnimationFrame(tick);
}

// 直接自动开始
sfx.play().catch(()=>{}); start();

// 动画 3.4s + 0.6s 淡出结束后通知宿主关窗（JS 精确时序，避免固定 Timer 偏差）
setTimeout(() => {
  try { window.webkit.messageHandlers.transition.postMessage('unlock-finish'); } catch (e) {}
}, 4000);
</script>
